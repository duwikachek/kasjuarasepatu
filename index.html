<body class="bg-[#e8decb] text-on-surface font-body-md antialiased selection:bg-tertiary-fixed-dim min-h-screen flex items-center justify-center p-0 sm:p-4">
  <!-- Mobile Container / Frame -->

    <!-- Top Notch / Status bar for mobile aesthetics (visible on larger screens) -->
    <div class="hidden sm:flex items-center justify-between px-6 pt-3 pb-1 text-xs text-neutral-400 z-50 bg-black select-none shrink-0 border-b border-neutral-900">
      <span id="live-clock" class="font-semibold text-[13px] text-white">09:41</span>
      <div class="w-20 h-4 bg-neutral-900 border border-neutral-800 rounded-full mx-auto"></div>
      <div class="flex items-center gap-1.5 text-neutral-400">
        <span class="material-symbols-outlined text-[14px]">signal_cellular_4_bar</span>
        <span class="material-symbols-outlined text-[14px]">wifi</span>
        <span class="material-symbols-outlined text-[16px]">battery_full</span>
      </div>
    </div>

    <!-- Main Dynamic View Container (Scrollable) -->
    <div id="app" class="flex-1 flex flex-col overflow-y-auto overflow-x-hidden relative"></div>

    <!-- Global Frozen Bottom Navigation (Always pinned at the bottom, never scrolls) -->
    <div id="global-bottom-nav" class="shrink-0 z-40 bg-black" style="background-color: #000000 !important;"></div>

    <!-- Global Toast Container -->
    <div id="toast-container" class="fixed sm:absolute bottom-24 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-[390px]"></div>

    <!-- Banner "Versi Baru Tersedia" (mode prompt: pengguna yang memutuskan kapan muat ulang) -->
    <div id="sw-update-banner" class="hidden fixed sm:absolute bottom-40 left-1/2 -translate-x-1/2 z-[110] flex items-center gap-2.5 w-11/12 max-w-[390px] px-3.5 py-3 rounded-2xl bg-black/95 backdrop-blur-md border border-neutral-700 text-white shadow-[0_10px_30px_rgba(0,0,0,0.5)]">
      <span class="material-symbols-outlined text-[22px] text-amber-400 shrink-0">system_update_alt</span>
      <div class="flex-1 min-w-0">
        <p class="text-xs font-bold leading-tight">Versi baru tersedia</p>
        <p class="text-[10px] text-neutral-400 leading-tight mt-0.5">Muat ulang untuk memakai versi terbaru.</p>
      </div>
      <button type="button" id="sw-update-reload" class="shrink-0 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold active:scale-95 transition-all">Muat Ulang</button>
      <button type="button" id="sw-update-dismiss" class="shrink-0 w-7 h-7 rounded-full hover:bg-neutral-800 text-neutral-400 flex items-center justify-center active:scale-90 transition-all" aria-label="Tutup notifikasi">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>

  <!-- Register Service Worker for PWA / Offline Support (mode prompt: tanya dulu sebelum update) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swPath = new URL('sw.js', window.location.href).pathname;
        const banner = document.getElementById('sw-update-banner');
        const reloadBtn = document.getElementById('sw-update-reload');
        const dismissBtn = document.getElementById('sw-update-dismiss');
        let waitingWorker = null;
        let reloading = false;

        function reloadApp() {
          if (reloading) return;
          reloading = true;
          window.location.reload();
        }

        function showUpdateBanner(worker) {
          waitingWorker = worker;
          if (banner) banner.classList.remove('hidden');
          console.log('[PWA] Versi baru tersedia. Menunggu konfirmasi pengguna.');
        }

        function hideUpdateBanner() {
          if (banner) banner.classList.add('hidden');
        }

        navigator.serviceWorker.register(swPath).then((reg) => {
          console.log('[PWA] Service Worker registered:', reg.scope);

          // SW baru sudah menunggu (mis. dari kunjungan sebelumnya) -> langsung tawarkan
          if (reg.waiting && navigator.serviceWorker.controller) {
            showUpdateBanner(reg.waiting);
          }

          reg.addEventListener('updatefound', () => {
            const installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', () => {
              // SW baru selesai terpasang & versi lama masih aktif -> tawarkan muat ulang
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBanner(installing);
              }
            });
          });

          // Cek pembaruan: saat load, tiap 15 menit, dan saat tab kembali aktif
          reg.update().catch(() => {});
          setInterval(() => reg.update().catch(() => {}), 15 * 60 * 1000);
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update().catch(() => {});
          });
        }).catch((err) => console.warn('[PWA] Service Worker failed:', err));

        if (reloadBtn) {
          reloadBtn.addEventListener('click', () => {
            if (waitingWorker) {
              waitingWorker.postMessage({ type: 'SKIP_WAITING' });
              // Fallback: bila event 'controllerchange' tidak terpicu, muat ulang manual
              setTimeout(reloadApp, 1500);
            } else {
              reloadApp();
            }
          });
        }
        if (dismissBtn) dismissBtn.addEventListener('click', hideUpdateBanner);

        navigator.serviceWorker.addEventListener('controllerchange', reloadApp);
      });
    }

    // Global helper to clear cache and update app
    window.forceAppUpdate = async function() {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      window.location.reload(true);
    };
  </script>
