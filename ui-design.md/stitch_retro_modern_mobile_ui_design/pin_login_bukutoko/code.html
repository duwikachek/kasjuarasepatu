<script>
  (function() {
    let pin = '1234';
    const indicators = document.querySelectorAll('#pin-indicator-group > div');
    const updateDots = () => {
      indicators.forEach((dot, index) => {
        if (index < pin.length) {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-on-tertiary-container shadow-sm transform scale-110 transition-all duration-200';
        } else {
          dot.className = 'w-3.5 h-3.5 rounded-full bg-surface-container-high transition-all duration-200';
        }
      });
    };

    document.querySelectorAll('.keypad-btn').forEach(button => {
      button.addEventListener('click', () => {
        if (pin.length < 6) {
          const val = button.querySelector('span').innerText.trim();
          pin += val;
          updateDots();
        }
      });
    });

    const backspace = document.querySelector('.keypad-backspace');
    if (backspace) {
      backspace.addEventListener('click', () => {
        if (pin.length > 0) {
          pin = pin.slice(0, -1);
          updateDots();
        }
      });
    }
  })();
